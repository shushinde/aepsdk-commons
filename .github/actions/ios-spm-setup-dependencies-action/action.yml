name: Setup Dependencies (iOS SPM)
description: >
  Pure-SPM setup: optionally pins the Xcode version. Package dependencies (including
  the SwiftLint build-tool plugin) are resolved by xcodebuild during the build, so there
  is no CocoaPods, Bundler, or XcodeGen step here.

inputs:
  xcode-version:
    description: "The version of Xcode to use. If not provided, the runner's default version is used."
    default: ''

runs:
  using: "composite"
  steps:
    - name: Select Xcode version
      if: ${{ inputs.xcode-version != '' }}
      uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
      with:
        xcode-version: ${{ inputs.xcode-version }}
