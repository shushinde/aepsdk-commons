name: z(Reusable) Validate Code (iOS SPM)

# Lint is enforced by the SwiftLint build-tool plugin during every xcodebuild in the
# test jobs, so this workflow only checks the public API surface hasn't drifted.

on:
  workflow_call:
    inputs:
      runner-image:
        type: string
        default: 'macos-15'
      xcode-version:
        description: "The version of Xcode to use. If not provided, the runner's default version is used."
        type: string
        default: ''

jobs:
  validate-code:
    name: Validate Code
    runs-on: ${{ inputs.runner-image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Dependencies
        uses: shushinde/aepsdk-commons/.github/actions/ios-spm-setup-dependencies-action@main
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Verify APIs
        run: make api-check
