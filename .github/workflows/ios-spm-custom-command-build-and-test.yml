name: z(Reusable) Custom Command Build and Test (iOS SPM)

# Generic single-command runner for a pure-SPM iOS/tvOS project. Runs the given `make`
# command against a chosen simulator, then optionally parses the xcresult bundle and
# uploads coverage to Codecov. Device/version are passed to the command as make variables.

on:
  workflow_call:
    inputs:
      runner-image:
        type: string
        default: 'macos-15'
      xcode-version:
        description: "The version of Xcode to use. If not provided, the runner's default version is used."
        type: string
        default: ''
      command:
        description: 'The make command to run (ex: make unit-test-ios).'
        type: string
        required: true
      device-name:
        description: 'Simulator device name (ex: iPhone 16 or Apple TV).'
        type: string
        default: ''
      os-version:
        description: 'Simulator OS version (ex: 18.6).'
        type: string
        default: ''
      platform:
        description: 'Which simulator variables to set: ios or tvos.'
        type: string
        default: 'ios'
      result-bundle-path:
        description: 'Path to the xcresult bundle. Enables coverage parsing when set.'
        type: string
        default: ''
      enable-codecov:
        type: boolean
        default: false
      codecov-flag:
        type: string
        default: ''

jobs:
  run-command:
    name: ${{ inputs.command }}
    runs-on: ${{ inputs.runner-image }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Dependencies
        uses: shushinde/aepsdk-commons/.github/actions/ios-spm-setup-dependencies-action@main
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Run command
        run: |
          if [ "${{ inputs.platform }}" = "tvos" ]; then
            ${{ inputs.command }} TVOS_DEVICE_NAME="${{ inputs.device-name }}" TVOS_VERSION="${{ inputs.os-version }}"
          else
            ${{ inputs.command }} IOS_DEVICE_NAME="${{ inputs.device-name }}" IOS_VERSION="${{ inputs.os-version }}"
          fi

      - name: Parse xcresult into coverage report
        if: ${{ always() && inputs.enable-codecov && inputs.result-bundle-path != '' }}
        continue-on-error: true
        run: |
          brew install xcresultparser
          mkdir -p ./build/coverage
          xcresultparser --output-format cobertura "${{ inputs.result-bundle-path }}" > ./build/coverage/coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ always() && inputs.enable-codecov && inputs.result-bundle-path != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@13ce06bfc6bbe3ecf90edbbf1bc32fe5978ca1d3 # v5.3.1
        with:
          directory: ./build/coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ inputs.codecov-flag }}
          verbose: true
